[package]
name = "hokum"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Hokum (hokum.app): a freedesktop notification daemon for Wayland, drawn with Rune."
homepage = "https://hokum.app"
repository = "https://github.com/anomalyco/hokum"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "e5a6431ccbdbee8442921a3e28e25185f2707f12" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "e5a6431ccbdbee8442921a3e28e25185f2707f12" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "e5a6431ccbdbee8442921a3e28e25185f2707f12" }
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
kdl = "6"
rhai = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Fork only: Rune at the same rev plus right-clicks and cursors on layer-shell
# overlays (uncomplexity/rune, branch layer-shell-right-click). Drop this once
# anomalyco/rune has them.
[patch."https://github.com/anomalyco/rune.git"]
rune = { git = "https://github.com/uncomplexity/rune.git", rev = "aacb909e4e2bd34f6ef8f7fa86b895dc46d05aa0" }
rune-kit = { git = "https://github.com/uncomplexity/rune.git", rev = "aacb909e4e2bd34f6ef8f7fa86b895dc46d05aa0" }
rune-theme-opencode = { git = "https://github.com/uncomplexity/rune.git", rev = "aacb909e4e2bd34f6ef8f7fa86b895dc46d05aa0" }

[profile.release]
codegen-units = 16
